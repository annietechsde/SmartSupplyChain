<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartSupplyChain - Shipments</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
</head>

<body>

    <header class="header">

        <div class="header-content">

            <div class="logo">
                SmartSupplyChain
            </div>

            <nav>
                <ul class="nav-links">

                    <li>
                        <a href="dashboard.html">Dashboard</a>
                    </li>

                    <li>
                        <a href="customers.html">Customers</a>
                    </li>

                    <li>
                        <a href="orders.html">Orders</a>
                    </li>

                    <li>
                        <a href="shipments.html">Shipments</a>
                    </li>

                    <li>
                        <a href="tracking.html">Tracking</a>
                    </li>

                    <li>
                        <a href="reports.html">Reports</a>
                    </li>

                    <li>
                        <a href="#" id="logoutButton">Logout</a>
                    </li>

                </ul>
            </nav>

        </div>

    </header>

    <main class="page-content">

        <h1 class="page-title">
            Shipments
        </h1>

        <!-- Create Shipment -->

        <section class="card">

            <h2>Create Shipment</h2>

            <form id="shipmentForm">

                <div class="form-row">

                    <div class="form-group">

                        <label for="orderId">
                            Order ID <span class="required">*</span>
                        </label>

                        <input
                            type="number"
                            id="orderId"
                            name="orderId"
                            placeholder="Enter order ID"
                            min="1"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label for="warehouseId">
                            Warehouse ID <span class="required">*</span>
                        </label>

                        <input
                            type="number"
                            id="warehouseId"
                            name="warehouseId"
                            placeholder="Enter warehouse ID"
                            min="1"
                            required
                        >

                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">

                        <label for="origin">
                            Origin
                        </label>

                        <input
                            type="text"
                            id="origin"
                            name="origin"
                            placeholder="Enter origin"
                        >

                    </div>

                    <div class="form-group">

                        <label for="destination">
                            Destination
                        </label>

                        <input
                            type="text"
                            id="destination"
                            name="destination"
                            placeholder="Enter destination"
                        >

                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">

                        <label for="estimatedDeliveryDate">
                            Estimated Delivery Date
                        </label>

                        <input
                            type="date"
                            id="estimatedDeliveryDate"
                            name="estimatedDeliveryDate"
                        >

                    </div>

                    <div class="form-group">

                        <label for="weight">
                            Weight
                        </label>

                        <input
                            type="number"
                            id="weight"
                            name="weight"
                            min="0"
                            step="0.01"
                            placeholder="Enter weight"
                        >

                    </div>

                </div>

                <button type="submit" class="btn-primary">
                    Create Shipment
                </button>

                <p id="shipmentMessage" class="form-message"></p>

            </form>

        </section>

        <!-- Shipment List -->

        <section class="card">

            <h2>Shipment List</h2>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Order ID</th>
                            <th>Tracking Number</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="shipmentTableBody">

                        <tr>
                            <td colspan="5">
                                Loading shipments...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="js/api.js"></script>
    <script src="js/shipments.js"></script>

</body>
</html>
